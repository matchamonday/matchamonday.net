name: API preview

on:
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/api-preview.yml"

concurrency:
  group: api-preview
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: api
          command: |
            d1 migrations apply matchamonday-feed-preview --remote --env preview
            deploy --env preview
      - name: Comment preview URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body \
            "API preview for ${{ github.event.pull_request.head.sha }} is live at https://api-preview.matchamonday.net. The Cloudflare Pages preview of this PR uses it, with its own database and photos."
